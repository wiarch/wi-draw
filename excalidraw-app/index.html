<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WI Draw — Visual Workspace</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#121212" />
    <meta name="title" content="WI Draw — Visual Workspace" />
    <meta
      name="description"
      content="Create diagrams, wireframes, mind maps and visual ideas on a simple, hand-drawn digital canvas."
    />
    <meta name="image" content="/og-image.png" />
    <meta property="og:site_name" content="WI Draw" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="WI Draw — Visual Workspace" />
    <meta
      property="og:description"
      content="A simple visual workspace for diagrams, wireframes, mind maps and collaborative thinking."
    />
    <meta property="og:image:alt" content="WI Draw visual workspace" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="WI Draw — Visual Workspace" />
    <meta
      property="twitter:description"
      content="A simple visual workspace for diagrams, wireframes, mind maps and collaborative thinking."
    />
    <meta property="twitter:image" content="/og-image.png" />

    <script>
      try {
        function setTheme(theme) {
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        }

        function getTheme() {
          const theme = window.localStorage.getItem("wi-draw-theme");
          if (theme && theme === "system") {
            return window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          return theme || "light";
        }

        setTheme(getTheme());
      } catch (e) {
        console.error("Error setting theme", e);
      }
    </script>
    <style>
      html.dark {
        background-color: #121212;
        color: #fff;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <% if (typeof PROD != 'undefined' && PROD == true) { %>
    <!-- Following placeholder is replaced during the build step -->
    <!-- PLACEHOLDER:EXCALIDRAW_APP_FONTS -->
    <link
      rel="stylesheet"
      href="../packages/excalidraw/fonts/fonts.css"
      type="text/css"
    />
    <% } else { %>
    <script>
      window.EXCALIDRAW_ASSET_PATH = window.origin;
    </script>
    <% } %>

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <meta name="version" content="{version}" />
    <script>
      window.name = "_wi_draw";
    </script>
    <style>
      body,
      html {
        margin: 0;
        -webkit-text-size-adjust: 100%;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .visually-hidden {
        position: absolute !important;
        height: 1px;
        width: 1px;
        overflow: hidden;
        clip: rect(1px, 1px, 1px, 1px);
        white-space: nowrap;
        user-select: none;
      }

      #root {
        height: 100%;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      @media screen and (min-width: 1200px) {
        #root {
          -webkit-touch-callout: default;
          -webkit-user-select: auto;
          -khtml-user-select: auto;
          -moz-user-select: auto;
          -ms-user-select: auto;
          user-select: auto;
        }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run WI Draw.</noscript>
    <header>
      <h1 class="visually-hidden">WI Draw</h1>
    </header>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
  </body>
</html>
